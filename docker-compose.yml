services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [redis]
    volumes: ["./apps/api:/app"] # live reload

  worker:
    build: ./apps/api
    command: rq worker --url redis://redis:6379
    env_file: .env
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
