repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        exclude: ^apps/web/(node_modules|\.next)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
        files: ^apps/api/
      - id: ruff
        args: [--fix]
        files: ^apps/api/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: ^apps/api/src/
        args: [--config-file=apps/api/pyproject.toml]
        additional_dependencies:
          - fastapi
          - pydantic-settings
          - sqlalchemy[asyncio]
          - structlog

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^apps/web/
        exclude: ^apps/web/(node_modules|\.next)/

  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        entry: bash -c 'cd apps/web && npx --no-install eslint .'
        language: system
        files: ^apps/web/.*\.(js|jsx|ts|tsx|mjs)$
        exclude: ^apps/web/(node_modules|\.next)/
        pass_filenames: false
